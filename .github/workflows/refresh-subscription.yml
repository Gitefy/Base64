name: Refresh US SG JP subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-subscription.yml"
      - "scripts/refresh_subscription.py"
      - "retired_sources.json"

permissions:
  contents: write

concurrency:
  group: refresh-us-sg-jp-subscription
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64, china-probe]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Verify China probe infrastructure
        run: |
          test -x /opt/china-probe/mihomo
          test -r /opt/china-probe/config.yaml
          ip route get 1.1.1.1 mark 0x80000 | grep -q "dev eth0"
          curl --fail --silent http://127.0.0.1:19090/version

      - name: Fetch, filter and China-test nodes
        run: python scripts/refresh_subscription.py

      - name: Commit refreshed subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.proxy "http://127.0.0.1:7890"
          git config https.proxy "http://127.0.0.1:7890"
          git add US_SG_JP_subscription_base64.txt US_SG_JP_stats.json node_health.json retired_sources.json
          git diff --cached --quiet || git commit -m "Refresh China-tested US SG JP subscription"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "git push failed (attempt $attempt/3); retrying..."
            sleep $((attempt * 3))
          done
          exit 1
